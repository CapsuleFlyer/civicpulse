# The Kubernetes equivalent of Compose's `internal: true`. Compose segments by
# network membership; here the pod network is flat, so segmentation has to be
# expressed as policy. Requires a CNI that enforces NetworkPolicy (Calico,
# Cilium); k3d's default Flannel does not, which is itself worth knowing — an
# unenforced policy is a comment with YAML syntax.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-accepts-backend-only
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: backend }
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-accepts-backend-only
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: backend }
      ports:
        - protocol: TCP
          port: 6379
