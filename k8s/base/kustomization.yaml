apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicpulse

labels:
  - pairs:
      app.kubernetes.io/part-of: civicpulse
    # Selectors are immutable on a Deployment and a StatefulSet; leaving them
    # alone means adding a label later is not a destructive change.
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
  - vpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
