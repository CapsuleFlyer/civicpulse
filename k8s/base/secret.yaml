# PLACEHOLDERS ONLY. This file is committed; real values never are.
#
# base64 is an encoding, not encryption — `echo <value> | base64 -d` is the
# entire attack. Supply the real values out of band:
#
#   kubectl -n civicpulse create secret generic backend-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=LLM_API_KEY="$GROQ_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# In a cluster that outlives a demo, this object is owned by External Secrets
# or Sealed Secrets instead, and the git copy stays a placeholder either way.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  POSTGRES_USER: "civic"
  POSTGRES_PASSWORD: "REPLACE_ME_AT_DEPLOY_TIME"
  POSTGRES_DB: "civicpulse"
  LLM_API_KEY: "REPLACE_ME_AT_DEPLOY_TIME"
