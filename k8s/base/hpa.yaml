apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Utilisation is usage ÷ requests, so this is 60% of the 100m request,
          # not 60% of a core. Raising requests lowers this number for the same
          # traffic — which is exactly the HPA/VPA conflict described in vpa.yaml.
          averageUtilization: 60
  behavior:
    scaleDown:
      # Slow down. Releasing capacity that is about to be needed again costs
      # more than holding it for five minutes.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      # Up immediately: citizens are waiting on a queue that is already backing up.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
