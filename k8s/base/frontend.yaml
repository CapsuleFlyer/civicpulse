apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend }
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: frontend
          image: ghcr.io/your-org/civicpulse-frontend:dev  # overlays pin this to a SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Same image, different environment — this is the payoff of writing
            # config.js at start-up instead of baking it into the bundle.
            - name: BACKEND_ORIGIN
              value: http://backend:8000
            - name: API_BASE_URL
              value: /api
            - name: APP_ENVIRONMENT
              value: production
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 15
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
