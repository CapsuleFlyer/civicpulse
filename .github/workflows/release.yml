name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write    # create the GitHub release
  packages: write    # push the semver tags

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/civicpulse-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/civicpulse-frontend

jobs:
  # A tag can be pushed to any commit, including one that never passed CI.
  # This job is the gate: nothing is published until the tagged tree is green.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install backend deps
        working-directory: ./backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: lint, types, tests
        working-directory: ./backend
        env:
          TRIAGE_PROVIDER: simulated
        run: |
          ruff check .
          mypy app
          pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: frontend checks
        working-directory: ./frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint
          npm run test

      - name: submission lint
        run: python scripts/check_submission.py

  release:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release notes need the history

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derive semver tags
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR"      >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR"      >> "$GITHUB_OUTPUT"

      - name: push backend semver tags
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.minor }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.major }}
          cache-from: type=gha

      - name: push frontend semver tags
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.minor }}
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.major }}
          cache-from: type=gha

      - name: generate release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Images for `${{ github.ref_name }}`:

            ```
            docker pull ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
            docker pull ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ```

            Deploy with `IMAGE_TAG=${{ steps.version.outputs.version }}`; see docs/RUNBOOK.md.
