name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write        # GHCR push, via GITHUB_TOKEN — scoped and revocable
  id-token: write        # keyless signing, if you enable the Cosign bonus

concurrency:
  group: cd-main
  cancel-in-progress: false   # never cancel a deploy half-way through

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/civicpulse-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/civicpulse-frontend

jobs:
  test:
    name: full suite on the merged result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend && mypy app
        working-directory: backend
      - run: pytest --cov=app
        working-directory: backend
        env:
          TRIAGE_PROVIDER: simulated
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run typecheck && npm test
        working-directory: frontend

  build-push:
    name: build, scan, sign and push
    runs-on: ubuntu-latest
    # Without this the pipeline would publish artifacts built from code it
    # already knows is broken.
    needs: [test]
    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # A scoped, revocable, per-run token. Never an account password.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # :latest may be pushed. It is never deployed — see the deploy job.
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: SBOM for the backend image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: spdx-json
          artifact-name: backend-sbom.spdx.json

      - name: sign both images (keyless)
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign --yes "${BACKEND_IMAGE}@${{ steps.backend.outputs.digest }}"
          cosign sign --yes "${FRONTEND_IMAGE}@${{ steps.frontend.outputs.digest }}"
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}

      - name: record what was published
        run: |
          {
            echo "### Published"
            echo "- backend  \`${{ github.sha }}\` → \`${{ steps.backend.outputs.digest }}\`"
            echo "- frontend \`${{ github.sha }}\` → \`${{ steps.frontend.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-k8s:
    name: deploy to an ephemeral cluster
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - uses: actions/checkout@v4

      - name: create a k3d cluster
        run: |
          curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create civicpulse --agents 1 --port "8081:80@loadbalancer" --wait
          kubectl cluster-info

      - name: install kustomize and metrics-server
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

      - name: create the real secret out of band
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n civicpulse create secret generic backend-secrets \
            --from-literal=POSTGRES_USER=civic \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD || 'ephemeral-cluster-password' }}" \
            --from-literal=POSTGRES_DB=civicpulse \
            --from-literal=LLM_API_KEY="${{ secrets.LLM_API_KEY || '' }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: deploy by immutable reference
        run: |
          cd k8s/overlays/prod
          # The commit SHA, never :latest. "What is production running?" has a
          # one-word answer you can paste into `git show`.
          kustomize edit set image \
            ghcr.io/your-org/civicpulse-backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          kustomize edit set image \
            ghcr.io/your-org/civicpulse-frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cd -
          kustomize build k8s/overlays/prod | kubectl apply -f -

      - name: wait for the rollout
        run: |
          kubectl -n civicpulse rollout status statefulset/postgres --timeout=180s
          kubectl -n civicpulse wait --for=condition=complete job/backend-migrate --timeout=180s
          kubectl -n civicpulse rollout status deployment/backend --timeout=240s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=180s

      - name: smoke test through the Ingress
        run: |
          kubectl -n civicpulse get ingress
          python scripts/integration_smoke.py --base-url http://localhost:8081 --host civicpulse.localhost

      - name: show the autoscaler
        run: |
          kubectl -n civicpulse get hpa backend -o wide
          kubectl -n civicpulse describe hpa backend | tail -20
          kubectl -n civicpulse top pods || echo "metrics-server still warming up"

      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl -n civicpulse get pods -o wide
          kubectl -n civicpulse describe pods | tail -120
          kubectl -n civicpulse logs -l app.kubernetes.io/name=backend --tail=200 || true

      - name: destroy the cluster
        if: always()
        run: k3d cluster delete civicpulse
