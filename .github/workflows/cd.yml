name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write        # GHCR push, via GITHUB_TOKEN
  id-token: write        # keyless signing (Cosign)

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: full suite on the merged result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements-dev.txt
      - name: lint and type check
        run: |
          ruff check .
          mypy app
        working-directory: backend
      - run: pytest --cov=app
        working-directory: backend
        env:
          TRIAGE_PROVIDER: simulated
          SIMULATED_SEED: "1337"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run typecheck && npm test
        working-directory: frontend

  build-push:
    name: build, scan, sign and push
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: lowercase image names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "BACKEND_IMAGE=ghcr.io/${repo}/civicpulse-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${repo}/civicpulse-frontend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: SBOM for the backend image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: spdx-json
          artifact-name: backend-sbom.spdx.json

      - name: install cosign
        uses: sigstore/cosign-installer@v3
      - name: sign both images (keyless)
        run: |
          cosign sign --yes "${BACKEND_IMAGE}@${{ steps.backend.outputs.digest }}"
          cosign sign --yes "${FRONTEND_IMAGE}@${{ steps.frontend.outputs.digest }}"

      - name: record what was published
        run: |
          {
            echo "### Published"
            echo "- backend  \`${{ github.sha }}\` → \`${{ steps.backend.outputs.digest }}\`"
            echo "- frontend \`${{ github.sha }}\` → \`${{ steps.frontend.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-k8s:
    name: deploy to an ephemeral cluster
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - uses: actions/checkout@v4

      - name: lowercase image names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "BACKEND_IMAGE=ghcr.io/${repo}/civicpulse-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${repo}/civicpulse-frontend" >> "$GITHUB_ENV"

      - name: create a k3d cluster
        run: |
          curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create civicpulse --agents 1 --port "8081:80@loadbalancer" --wait
          kubectl cluster-info

      - name: install kustomize and metrics-server
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

      - name: create the real secret out of band
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n civicpulse create secret generic backend-secrets \
            --from-literal=POSTGRES_USER=civic \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD || 'ephemeral-cluster-password' }}" \
            --from-literal=POSTGRES_DB=civicpulse \
            --from-literal=LLM_API_KEY="${{ secrets.LLM_API_KEY || '' }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: deploy by immutable reference
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          cd k8s/overlays/prod
          # The commit SHA, never :latest.
          kustomize edit set image \
            "${BACKEND_IMAGE}=${BACKEND_IMAGE}:${GITHUB_SHA}" \
            "${FRONTEND_IMAGE}=${FRONTEND_IMAGE}:${GITHUB_SHA}"
          cd - > /dev/null
          kustomize build k8s/overlays/prod > /tmp/rendered.yaml

          # Guard: fail loudly if kustomize did not inject the SHA.
          grep -q "${BACKEND_IMAGE}:${GITHUB_SHA}" /tmp/rendered.yaml || { echo "backend SHA not injected"; exit 1; }
          grep -q "${FRONTEND_IMAGE}:${GITHUB_SHA}" /tmp/rendered.yaml || { echo "frontend SHA not injected"; exit 1; }
          if grep -Eq "image: .*:(dev|latest)$" /tmp/rendered.yaml; then
            echo "an app image is still on :dev or :latest"; grep -E "image: " /tmp/rendered.yaml; exit 1
          fi

          # Never apply the placeholder Secret over the real one created above,
          # and skip the VPA: k3d has no VerticalPodAutoscaler CRD, so applying
          # it would fail the whole deploy. (Recommender-only, so nothing is lost.)
          yq -i 'select(.kind != "Secret" and .kind != "VerticalPodAutoscaler")' /tmp/rendered.yaml

          # No LLM key in this ephemeral cluster: use the deterministic provider.
          if [ -z "${LLM_API_KEY}" ]; then
            yq -i '(select(.kind == "ConfigMap") | .data.TRIAGE_PROVIDER) = "simulated"' /tmp/rendered.yaml
          fi

          kubectl apply -f /tmp/rendered.yaml

      - name: wait for the rollout
        run: |
          kubectl -n civicpulse rollout status statefulset/postgres --timeout=180s
          # Fail as soon as the Job exhausts its retries instead of sitting out a timeout.
          for i in $(seq 1 90); do
            ok=$(kubectl -n civicpulse get job backend-migrate -o jsonpath='{.status.succeeded}')
            bad=$(kubectl -n civicpulse get job backend-migrate -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')
            [ "$ok" = "1" ] && break
            [ "$bad" = "True" ] && { echo "migration job failed"; exit 1; }
            sleep 2
          done
          [ "$ok" = "1" ] || { echo "migration job did not finish in time"; exit 1; }
          kubectl -n civicpulse rollout status deployment/backend --timeout=240s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=180s

      - name: smoke test the API
        run: |
          # /ready, /health and /metrics are deliberately not exposed by the
          # Ingress, so reach the backend Service directly for the full suite.
          kubectl -n civicpulse port-forward svc/backend 18000:8000 > /tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 3
          python3 scripts/integration_smoke.py --base-url http://localhost:18000

      - name: smoke test through the Ingress
        run: |
          kubectl -n civicpulse get ingress
          for attempt in $(seq 1 60); do
            if curl -fsS -H "Host: civicpulse.localhost" http://localhost:8081/api/stats -o /dev/null; then
              echo "API reachable through the Ingress"; break
            fi
            [ "$attempt" = 60 ] && { echo "Ingress never routed /api"; exit 1; }
            sleep 2
          done
          curl -fsS -H "Host: civicpulse.localhost" http://localhost:8081/ | grep -q '<div id="root">'
          echo "frontend reachable through the Ingress"

      - name: show what is running and the autoscaler
        run: |
          kubectl -n civicpulse get deploy -o wide
          kubectl -n civicpulse get hpa backend -o wide
          kubectl -n civicpulse describe hpa backend | tail -20
          kubectl -n civicpulse top pods || echo "metrics-server still warming up"

      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl -n civicpulse get pods -o wide
          echo "=== migration job ==="
          kubectl -n civicpulse describe job backend-migrate | tail -30 || true
          kubectl -n civicpulse logs -l job-name=backend-migrate --tail=100 --prefix || true
          echo "=== pods ==="
          kubectl -n civicpulse describe pods | tail -120
          kubectl -n civicpulse logs -l app.kubernetes.io/name=backend --tail=200 || true

      - name: destroy the cluster
        if: always()
        run: k3d cluster delete civicpulse
